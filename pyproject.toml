[project]
name = "ultra-command"
version = "0.1.0"
description = "Voice control for the Linux desktop (KDE Plasma / Wayland): spoken commands, dictation and a local LLM that can act"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# dbus-python and PyGObject come from the distribution (venv with --system-site-packages).
dependencies = []

[project.scripts]
ultra-command = "ultracommand.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
ultracommand = ["data/*"]
