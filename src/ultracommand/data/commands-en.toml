# Ultra-Command – English commands.
# Your own commands go into ~/.config/ultra-command/commands.toml (same format,
# the same id replaces a command from here). Dry run: ultra-command match "maximize window"

# Context for Whisper: one complete sentence with words it would otherwise mishear (program
# names!). No comma lists – Whisper imitates the style. And no command: on silence Whisper
# sometimes repeats the context, and a command in it would then run.
prompt = "This computer runs Thunderbird, Dolphin, Kate and several consoles, with windows, tabs and desktops."

filler = ["please", "now", "just", "the", "a", "an"]

# What Whisper likes to invent on silence.
ignore = ["thank you", "thanks for watching", "thank you for watching", "you", "bye"]

[keywords]
# At the start of an utterance: everything after it goes to …
assistant = ["computer", "assistant", "hey computer", "local ai"]
dictate = ["type", "write", "dictate"]
cancel = ["cancel", "never mind", "forget it"]

[numbers]
one = 1
two = 2
three = 3
four = 4
five = 5
six = 6
seven = 7
eight = 8
nine = 9
ten = 10
eleven = 11
twelve = 12
once = 1
twice = 2
fifteen = 15
twenty = 20

[slots.app]
"browser" = "google-chrome"
"chrome" = "google-chrome"
"firefox" = "firefox"
"mail" = "thunderbird"
"email" = "thunderbird"
"files" = "dolphin"
"file manager" = "dolphin"
"terminal" = "konsole"
"console" = "konsole"
"shell" = "konsole"
"editor" = "kate"
"calculator" = "kcalc"
"settings" = "systemsettings"
"system settings" = "systemsettings"
"screenshot" = "spectacle"
"vs code" = "code"

[[command]]
id = "window.maximize"
say = ["maximize window", "maximize", "make it bigger"]
do = { kwin = "Window Maximize" }
help = "Maximize or restore the active window"

[[command]]
id = "window.minimize"
say = ["minimize window", "minimize", "hide window"]
do = { kwin = "Window Minimize" }
help = "Minimize the active window"

[[command]]
id = "window.minimize_app"
say = ["minimize {app}", "hide {app}"]
do = { minimize = "{app}" }
help = "Minimize the window of an application"

[[command]]
id = "window.close"
say = ["close window"]
do = { kwin = "Window Close" }
help = "Close the active window"
guess = false

[[command]]
id = "window.fullscreen"
say = ["fullscreen", "full screen"]
do = { kwin = "Window Fullscreen" }
help = "Toggle fullscreen of the active window"

[[command]]
id = "window.tile_left"
say = ["window left", "tile left", "snap left"]
do = { kwin = "Window Quick Tile Left" }
help = "Tile the active window to the left half"

[[command]]
id = "window.tile_right"
say = ["window right", "tile right", "snap right"]
do = { kwin = "Window Quick Tile Right" }
help = "Tile the active window to the right half"

[[command]]
id = "window.next_screen"
say = ["other screen", "next screen", "move to other screen"]
do = { kwin = "Window to Next Screen" }
help = "Move the active window to the next screen"

[[command]]
id = "window.switch"
say = ["switch window", "next window"]
do = { key = "alt+tab" }
help = "Switch to the previously used window"

[[command]]
id = "desktop.overview"
say = ["overview", "show all windows"]
do = { kwin = "Overview" }
help = "Show the overview of all windows"

[[command]]
id = "desktop.show"
say = ["show desktop"]
do = { kwin = "Show Desktop" }
help = "Show the desktop (minimize everything)"

[[command]]
id = "desktop.switch"
say = ["desktop {n}", "workspace {n}"]
do = { kwin = "Switch to Desktop {n}" }
help = "Switch to virtual desktop number n"

[[command]]
id = "window.focus"
say = ["switch to {app}", "go to {app}", "next {app}", "other {app}", "{app}"]
do = { focus = "{app}" }
help = "Switch to the window of an application (the next one if it is already active); start it if it is not running"

[[command]]
id = "app.open"
say = ["open {app}", "start {app}", "launch {app}"]
do = { run = "{app}" }
help = "Start an application"

[[command]]
id = "tab.new"
say = ["new tab"]
do = { key = "ctrl+t", terminal = "ctrl+shift+t" }
help = "Open a new tab"

[[command]]
id = "tab.close"
say = ["close tab"]
do = { key = "ctrl+w", terminal = "ctrl+shift+w" }
help = "Close the current tab"
guess = false

[[command]]
id = "tab.next"
say = ["next tab"]
do = { key = "ctrl+tab" }
help = "Go to the next tab"

[[command]]
id = "tab.previous"
say = ["previous tab"]
do = { key = "ctrl+shift+tab" }
help = "Go to the previous tab"

[[command]]
id = "tab.reopen"
say = ["reopen tab", "restore tab"]
do = { key = "ctrl+shift+t" }
help = "Reopen the last closed tab"

[[command]]
id = "page.reload"
